<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
</head>
<body>
    <h1>API Test</h1>
    <button onclick="testCustomers()">Test Customers API</button>
    <button onclick="testOrders()">Test Orders API</button>
    <div id="result"></div>

    <script>
        async function testCustomers() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing Customers API...';
            
            try {
                const response = await fetch('https://66f6699f436827ced97704c4.mockapi.io/customers', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                resultDiv.innerHTML = `<h3>Customers API Response:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        }

        async function testOrders() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing Orders API...';
            
            try {
                const response = await fetch('https://66f6699f436827ced97704c4.mockapi.io/orders', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                resultDiv.innerHTML = `<h3>Orders API Response:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
